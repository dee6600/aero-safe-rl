# Episode record schema (M3). The one format every writer in this project
# uses for one flight -- M4's runner, M6's dataset, M7's detector, M9's RL
# loop and M10's metrics all read records shaped exactly like this. Changing
# a field here means bumping schema_version, not editing a reader to cope
# with two shapes (CLAUDE.md §7).
#
# Loaded and enforced by experiments/episode_schema.py -- that module, not
# this file alone, is what a writer actually calls. termination_reasons and
# reset_tiers are mirrored by Python enums in that module; a test
# (tests/test_episode_schema.py::test_termination_reason_enum_closed) pins
# the two representations equal so they cannot silently drift apart.
#
# v3 (M5 task 2) added raw attitude/rate/acceleration/motor-output step
# fields. These are RAW telemetry, not computed features -- M5's
# FeatureExtractor (ai/features/feature_extractor.py) reads them to build a
# feature vector on demand; no derived feature is written into the schema
# itself, so a feature_version bump never forces a schema bump.
#
# v4 (M6 task 2) added ground-truth rotor-fault labels: episode-level fields
# describing what fault (if any) was commanded, when, and whether it was
# confirmed actually applied and PX4's own FailureDetector stayed silent,
# plus one step-level passthrough of PX4's failure_detector_status bitmask.
# These are LABELS for the detector to train against (CLAUDE.md §1.7 /
# anti-pattern 12) -- tests/test_fault_fields_not_in_observation.py asserts
# none of them ever appears in configs/rl/observation_v1.yaml or as a
# side: shared entry in configs/features.yaml. fault_type/fault_profile
# mirror experiments/fault_schedule.py's FaultType/FaultProfile enums
# exactly (one definition, imported by episode_schema.py -- not redefined).

schema_version: "4"

# Closed enum for the fault (if any) commanded during an episode. "none" is
# the healthy case. v1 implements exactly one non-none fault type
# (planning.md §6) -- mirrors experiments.fault_schedule.FaultType.
fault_types:
  - none
  - rotor_thrust_degradation

# Closed enum for the fault's onset profile. "none" is the healthy case.
# "intermittent" is deferred past v1 (planning.md §6's backlog table) --
# mirrors experiments.fault_schedule.FaultProfile.
fault_profiles:
  - none
  - step
  - ramp

# Closed enum. A record's termination_reason must be exactly one of these.
# Extend deliberately when a milestone adds a real new outcome -- never write
# a free-text reason (CLAUDE.md anti-pattern 16).
#
# v2 (M4 tasks 1-3) added worker_restarted and offboard_lost. M4 task 4 added
# sim_fault, the last row of docs/parallelism.md §8's failure catalogue --
# still schema v2, since the file already scoped both as v2's job.
termination_reasons:
  - completed          # all waypoints reached, final hover held, landed and disarmed
  - preflight_failed    # PX4 never reported pre_flight_checks_pass=True
  - arm_timeout          # preflight passed but PX4 never confirmed ARMED
  - offboard_rejected     # armed but PX4 never reached NAVIGATION_STATE_OFFBOARD
  - offboard_lost          # OFFBOARD engaged, then nav_state left it unexpectedly mid-flight
  - hold_timeout            # a waypoint/hover hold's wall-clock watchdog elapsed
  - land_timeout             # land commanded but PX4 never confirmed DISARMED
  - episode_timeout           # the mission's own sim-time budget elapsed first
  - worker_restarted            # supervisor detected a dead PID/stalled telemetry and restarted the worker mid-episode
  - sim_fault                    # position or velocity reported a non-finite value -- the simulation itself broke
  - aborted_error                 # an exception outside the typed flight-sequence errors

# Closed enum for the tier of reset applied before this episode's flight.
# "none" is the one legitimate value for the first episode flown on a
# freshly started worker, before any reset has happened.
reset_tiers:
  - none
  - soft
  - medium
  - hard

# One row, written once, when an episode ends.
episode_fields:
  required:
    - schema_version
    - run_id
    - episode_id
    - worker_id
    - instance
    - seed
    - instance_spec_digest
    - mission_id
    - mission_config_digest
    - feature_version
    - env_versions
    - reset_tier
    - termination_reason
    - valid
    - t_sim_start_s
    - t_sim_end_s
    - t_sim_duration_s
    - t_wall_start_utc
    - t_wall_end_utc
    - t_wall_duration_s
    - n_steps
    - waypoints_reached
    - position_rmse_m
    - final_position_error_m
    - fault_config_digest
    - fault_applied
    - fault_type
    - fault_rotor_index
    - fault_severity_commanded
    - fault_onset_time_s_requested
    - fault_onset_time_s_observed
    - fault_profile
    - fault_ramp_duration_s
    - fault_confirmed_applied
    - fault_confirmed_severity_final
    - px4_failure_detector_silent

# One row per control-loop tick during the flight (CONTROL_RATE_HZ in
# mission_executor.py), written by the same episode's logger before the
# summary row.
step_fields:
  required:
    - schema_version
    - run_id
    - episode_id
    - worker_id
    - step_index
    - t_sim_s
    - t_wall_utc
    - armed
    - nav_state
    - pos_x
    - pos_y
    - pos_z
    - vel_x
    - vel_y
    - vel_z
    - target_x
    - target_y
    - target_z
    - position_error_m
    - battery_remaining
    - roll_rad
    - pitch_rad
    - yaw_rad
    - rate_p_rad_s
    - rate_q_rad_s
    - rate_r_rad_s
    - accel_x_m_s2
    - accel_y_m_s2
    - accel_z_m_s2
    - motor_0_output
    - motor_1_output
    - motor_2_output
    - motor_3_output
    - px4_failure_detector_status
