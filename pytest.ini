[pytest]
testpaths = tests
markers =
    sim: needs a running SITL instance (~1 min each); run before closing a milestone
    slow: needs multiple instances or training (minutes+); run explicitly
    isaac: starts Isaac Sim (isaac/tests, isaacsim environment only)
# A hang is a failure. pytest-timeout turns "the suite never finished" into a
# readable traceback instead of a stuck terminal -- see CLAUDE.md §5.
timeout = 300
# /opt/ros/humble is on PYTHONPATH in this project's shells (CLAUDE.md §0), so
# ROS ships its own pytest plugins into every run. `launch_testing` still uses
# the `path` hook argument that pytest 8 removed, and aborts collection before
# a single test runs. None of these plugins are used here -- they are ROS
# launch-file helpers and ament linters -- so they are disabled explicitly.
# Do not "fix" this by downgrading pytest.
addopts =
    -ra
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
